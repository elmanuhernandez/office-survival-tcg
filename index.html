<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorpCards TCG - Creador Neo-Brutalista</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                    },
                    boxShadow: {
                        'brutal': '8px 8px 0px 0px rgba(0,0,0,1)',
                        'brutal-sm': '4px 4px 0px 0px rgba(0,0,0,1)',
                        'brutal-hover': '4px 4px 0px 0px rgba(0,0,0,1)',
                    },
                    colors: {
                        'dept-ti': '#60A5FA', // Blue
                        'dept-ventas': '#F87171', // Red
                        'dept-rrhh': '#F472B6', // Pink
                        'dept-finanzas': '#4ADE80', // Green
                        'dept-operaciones': '#FACC15', // Yellow
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0f0f0;
            background-image: radial-gradient(#d1d5db 2px, transparent 2px);
            background-size: 32px 32px;
        }
        /* Custom scrollbar for brutalist feel */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #fff; border-left: 2px solid #000; }
        ::-webkit-scrollbar-thumb { background: #000; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Initialization
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'corp-tcg-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, db, auth;
        if (Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        }

        window.firebaseDependencies = { app, db, auth, appId, signInAnonymously, signInWithCustomToken, collection, addDoc, onSnapshot, deleteDoc, doc };
    </script>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        const defaultCard = {
            name: 'El Mono de Oficina',
            department: 'Ventas',
            cost: 5,
            attack: 4,
            defense: 2,
            effect: 'Aumenta la productividad de todos pero exige café cada turno. Si no hay café disponible, destruye una carta de tu propia mano.',
            imageUrl: ''
        };

        const deptColors = {
            'TI': 'bg-dept-ti',
            'Ventas': 'bg-dept-ventas',
            'RRHH': 'bg-dept-rrhh',
            'Finanzas': 'bg-dept-finanzas',
            'Operaciones': 'bg-dept-operaciones'
        };

        const App = () => {
            const [formData, setFormData] = useState(defaultCard);
            const [savedCards, setSavedCards] = useState([]);
            const [user, setUser] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            useEffect(() => {
                const initAuth = async () => {
                    const { auth, signInWithCustomToken, signInAnonymously } = window.firebaseDependencies;
                    if (!auth) return;

                    try {
                        if (typeof __initial_auth_token !== 'undefined') {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth Error:", error);
                    }
                };

                initAuth();

                const { auth: fbAuth } = window.firebaseDependencies;
                if(fbAuth) {
                    const unsubscribe = fbAuth.onAuthStateChanged((u) => {
                        setUser(u);
                    });
                    return () => unsubscribe();
                }
            }, []);

            useEffect(() => {
                if (!user) return;
                
                const { db, appId, collection, onSnapshot } = window.firebaseDependencies;
                if (!db) return;

                const cardsRef = collection(db, 'artifacts', appId, 'public', 'data', 'cards');
                
                const unsubscribe = onSnapshot(cardsRef, (snapshot) => {
                    const cardsData = [];
                    snapshot.forEach((doc) => {
                        cardsData.push({ id: doc.id, ...doc.data() });
                    });
                    setSavedCards(cardsData.reverse()); // Show newest first
                }, (error) => {
                    console.error("Error fetching cards:", error);
                });

                return () => unsubscribe();
            }, [user]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: name === 'cost' || name === 'attack' || name === 'defense' ? Number(value) || 0 : value
                }));
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const handleSave = async () => {
                if (!user) {
                    showToast("Error: No autenticado.");
                    return;
                }
                setIsSaving(true);
                try {
                    const { db, appId, collection, addDoc } = window.firebaseDependencies;
                    const cardsRef = collection(db, 'artifacts', appId, 'public', 'data', 'cards');
                    await addDoc(cardsRef, {
                        ...formData,
                        createdAt: new Date().toISOString(),
                        createdBy: user.uid
                    });
                    showToast("¡Carta Guardada en la Base de Datos!");
                } catch (error) {
                    console.error("Save error", error);
                    showToast("Error al guardar la carta.");
                }
                setIsSaving(false);
            };

            const handleDelete = async (id) => {
                if (!user) return;
                try {
                    const { db, appId, deleteDoc, doc } = window.firebaseDependencies;
                    const cardDoc = doc(db, 'artifacts', appId, 'public', 'data', 'cards', id);
                    await deleteDoc(cardDoc);
                    showToast("Carta eliminada.");
                } catch (error) {
                    console.error("Delete error", error);
                }
            };

            const handleCopyPrompt = () => {
                navigator.clipboard.writeText(generatePrompt());
                showToast("¡Prompt Copiado!");
            };

            const generatePrompt = () => {
                return `A neo-brutalist corporate satire illustration of "${formData.name}", representing the ${formData.department} department. Flat high-contrast colors, thick black outlines, vector art style, comic book aesthetic, chaotic office environment context. Centered composition, aspect ratio 1:1, white background.`;
            };

            const CardView = ({ card, isPreview = false, onDelete }) => {
                const bgColor = deptColors[card.department] || 'bg-white';
                return (
                    <div className={`relative w-72 h-[26rem] border-4 border-black ${bgColor} shadow-brutal flex flex-col p-3 transition-transform ${isPreview ? '' : 'hover:-translate-y-2 hover:shadow-brutal-sm'}`}>
                        {/* Header */}
                        <div className="flex justify-between items-center border-b-4 border-black pb-2 mb-2 bg-white p-2 border-4">
                            <h3 className="font-bold text-lg uppercase truncate flex-1 font-black leading-tight">{card.name || 'SIN NOMBRE'}</h3>
                            <div className="flex items-center justify-center bg-black text-white w-8 h-8 rounded-full font-bold ml-2 shrink-0">
                                ☕{card.cost}
                            </div>
                        </div>

                        {/* Image Placeholder */}
                        <div className="flex-1 bg-white border-4 border-black mb-2 flex items-center justify-center overflow-hidden relative">
                            {card.imageUrl ? (
                                <img src={card.imageUrl} alt={card.name} className="w-full h-full object-cover" />
                            ) : (
                                <div className="text-center p-4">
                                    <div className="text-4xl mb-2 opacity-50">🏢</div>
                                    <p className="text-xs font-bold text-gray-500 uppercase tracking-widest">{card.department}</p>
                                </div>
                            )}
                        </div>

                        {/* Type & Stats */}
                        <div className="bg-black text-white px-2 py-1 flex justify-between items-center mb-2 font-bold uppercase text-xs">
                            <span>{card.department}</span>
                            <span className="text-[10px] tracking-wider text-gray-300">Nivel Corporativo</span>
                        </div>

                        {/* Effect Box */}
                        <div className="bg-white border-4 border-black p-2 h-24 overflow-y-auto mb-2 text-sm leading-snug font-medium">
                            {card.effect || 'Sin efecto aparente. Probablemente esté en una reunión.'}
                        </div>

                        {/* Combat Stats */}
                        <div className="flex justify-between gap-2 mt-auto">
                            <div className="bg-red-400 border-4 border-black px-3 py-1 font-black flex items-center gap-1">
                                ⚔️ {card.attack}
                            </div>
                            <div className="bg-blue-300 border-4 border-black px-3 py-1 font-black flex items-center gap-1">
                                🛡️️ {card.defense}
                            </div>
                        </div>

                        {!isPreview && onDelete && (
                            <button 
                                onClick={() => onDelete(card.id)}
                                className="absolute -top-3 -right-3 bg-red-500 text-white w-8 h-8 border-4 border-black rounded-full flex items-center justify-center font-bold hover:bg-red-600 z-10"
                                title="Despedir (Eliminar)"
                            >
                                X
                            </button>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans text-black">
                    <header className="mb-8 border-4 border-black bg-white p-6 shadow-brutal inline-block w-full">
                        <h1 className="text-4xl md:text-6xl font-black uppercase tracking-tighter">CorpCards<span className="text-red-500">_</span>TCG</h1>
                        <p className="text-xl font-bold mt-2 text-gray-600">Sistema de Gestión de Recursos (Cartas)</p>
                    </header>

                    {toastMessage && (
                        <div className="fixed top-4 right-4 bg-yellow-400 border-4 border-black p-4 shadow-brutal font-bold z-50 animate-bounce">
                            ⚠️ {toastMessage}
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Left Column: Form & Prompt */}
                        <div className="lg:col-span-5 space-y-8">
                            <div className="bg-white border-4 border-black p-6 shadow-brutal">
                                <h2 className="text-2xl font-black mb-6 border-b-4 border-black pb-2">NUEVO EMPLEADO / EVENTO</h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block font-bold mb-1 uppercase">Nombre del Recurso</label>
                                        <input 
                                            type="text" 
                                            name="name" 
                                            value={formData.name} 
                                            onChange={handleChange}
                                            className="w-full border-4 border-black p-2 font-bold focus:outline-none focus:bg-yellow-100 transition-colors"
                                            placeholder="Ej: El Pasante"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block font-bold mb-1 uppercase">Departamento</label>
                                            <select 
                                                name="department" 
                                                value={formData.department} 
                                                onChange={handleChange}
                                                className="w-full border-4 border-black p-2 font-bold bg-white focus:outline-none cursor-pointer"
                                            >
                                                <option value="TI">TI (Sistemas)</option>
                                                <option value="Ventas">Ventas & Mkt</option>
                                                <option value="RRHH">Recursos Humanos</option>
                                                <option value="Finanzas">Finanzas</option>
                                                <option value="Operaciones">Operaciones</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block font-bold mb-1 uppercase text-amber-800">Costo (Café)</label>
                                            <input 
                                                type="number" 
                                                name="cost" 
                                                value={formData.cost} 
                                                onChange={handleChange}
                                                className="w-full border-4 border-black p-2 font-bold focus:outline-none focus:bg-amber-100"
                                                min="0"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block font-bold mb-1 uppercase text-red-600">Ataque (Estrés)</label>
                                            <input 
                                                type="number" 
                                                name="attack" 
                                                value={formData.attack} 
                                                onChange={handleChange}
                                                className="w-full border-4 border-black p-2 font-bold focus:outline-none focus:bg-red-100"
                                                min="0"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold mb-1 uppercase text-blue-600">Defensa (Cordura)</label>
                                            <input 
                                                type="number" 
                                                name="defense" 
                                                value={formData.defense} 
                                                onChange={handleChange}
                                                className="w-full border-4 border-black p-2 font-bold focus:outline-none focus:bg-blue-100"
                                                min="0"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-bold mb-1 uppercase">Efecto / Habilidad</label>
                                        <textarea 
                                            name="effect" 
                                            value={formData.effect} 
                                            onChange={handleChange}
                                            rows="3"
                                            className="w-full border-4 border-black p-2 font-bold focus:outline-none focus:bg-yellow-100 resize-none"
                                            placeholder="¿Qué burocracia desata esta carta?"
                                        ></textarea>
                                    </div>

                                    <button 
                                        onClick={handleSave}
                                        disabled={isSaving || !user}
                                        className={`w-full border-4 border-black p-4 font-black text-xl uppercase transition-transform ${isSaving || !user ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-400 hover:bg-green-500 hover:-translate-y-1 shadow-brutal-sm active:translate-y-0 active:shadow-none'}`}
                                    >
                                        {isSaving ? 'FIRMANDO CONTRATO...' : 'Guardar en Base de Datos'}
                                    </button>
                                </div>
                            </div>

                            {/* Prompt Generator Box */}
                            <div className="bg-black text-white p-6 shadow-brutal border-4 border-black relative">
                                <h2 className="text-2xl font-black mb-4 flex justify-between items-center uppercase">
                                    Generador de Prompt (IA)
                                    <span className="text-xs bg-white text-black px-2 py-1 font-bold">Nano Banana</span>
                                </h2>
                                <p className="text-sm text-gray-300 mb-2 font-medium">Copia este texto para generar el arte consistente con el estilo de tu juego:</p>
                                <div className="bg-gray-900 border-2 border-gray-700 p-4 font-mono text-sm mb-4 min-h-[100px]">
                                    {generatePrompt()}
                                </div>
                                <button 
                                    onClick={handleCopyPrompt}
                                    className="bg-yellow-400 text-black border-4 border-white px-6 py-2 font-black uppercase hover:bg-yellow-300 active:bg-yellow-500 transition-colors w-full"
                                >
                                    Copiar Prompt
                                </button>
                            </div>
                        </div>

                        {/* Right Column: Preview & Gallery */}
                        <div className="lg:col-span-7 space-y-8">
                            
                            {/* Live Preview */}
                            <div className="bg-white border-4 border-black p-6 shadow-brutal flex flex-col items-center justify-center py-12 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-4 bg-yellow-400 border-b-4 border-black"></div>
                                <h2 className="text-2xl font-black uppercase absolute top-8 left-6 bg-white px-2 border-4 border-black z-10">Vista Previa (En Vivo)</h2>
                                
                                <div className="mt-8 scale-110 origin-center transition-all duration-300">
                                    <CardView card={formData} isPreview={true} />
                                </div>
                            </div>

                            {/* Database Gallery */}
                            <div className="bg-white border-4 border-black p-6 shadow-brutal">
                                <h2 className="text-2xl font-black mb-6 uppercase border-b-4 border-black pb-2">Archivo Histórico (Base de Datos)</h2>
                                
                                {savedCards.length === 0 ? (
                                    <div className="p-8 border-4 border-dashed border-gray-300 text-center text-gray-500 font-bold uppercase">
                                        La base de datos está vacía. Contrata a alguien.
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-2 gap-x-4 gap-y-10 justify-items-center">
                                        {savedCards.map(card => (
                                            <CardView key={card.id} card={card} onDelete={handleDelete} />
                                        ))}
                                    </div>
                                )}
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
